# Push a tag that matches manifest.json's version (e.g. 1.1.1) and this makes
# a draft release with theme.css and manifest.json. Check the draft on GitHub,
# then publish it.
name: Release

on:
  push:
    tags: ["*"]

permissions:
  contents: write
  id-token: write # attestations: sign with GitHub's OIDC identity
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches manifest.json
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="$(node -p "require('./manifest.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag doesn't match manifest.json version $version"
            exit 1
          fi

      # Provenance: anyone can check these files were built here, from this commit
      # (gh attestation verify <file> --repo krishnanefx/obsidian-tahoe-theme).
      - name: Attest the release files
        uses: actions/attest@v4
        with:
          subject-path: |
            theme.css
            manifest.json

      - name: Draft the release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The release notes are the tag's message (git tag -a 1.2.3 -m "…").
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          gh release create "$tag" --title "$tag" --draft --notes-from-tag theme.css manifest.json
